# End-to-end: prefetch everything per the manifests, then prove the cache is
# complete. Catches lockfile drift, version drift, and broken specs.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Toolchain for parser builds
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make curl git
          cargo install tree-sitter-cli --locked

      - name: Bootstrap (prefetch parsers + Mason packages)
        run: ./scripts/bootstrap.sh

      - name: Verify (cache complete, no drift)
        run: ./scripts/verify.sh
